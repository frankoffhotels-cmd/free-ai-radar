<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b1020">
    <title>Free AI Radar</title>
    <link rel="stylesheet" href="style.css">
    <script src="popup.js" defer></script>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">✦</div>
          <div>
            <p class="eyebrow">КАТАЛОГ ИИ-ПРОВАЙДЕРОВ</p>
            <h1>Free AI <span>Radar</span></h1>
          </div>
        </div>
        <button class="refresh-button" id="refresh-button" type="button">
          <svg class="refresh-icon" viewBox="0 0 20 20" aria-hidden="true">
            <path d="M16.5 10a6.5 6.5 0 0 1-11.2 4.5M3.5 10a6.5 6.5 0 0 1 11.2-4.5M3.5 14.5V10h4.5M16.5 5.5V10H12"/>
          </svg>
          <span>Обновить</span>
        </button>
      </header>

      <p class="intro">Бесплатные лимиты и пробные тарифы для работы с ИИ-моделями.</p>
      <p class="status" id="status" role="status" aria-live="polite">Загружаем каталог…</p>
      <section class="provider-grid" id="provider-grid" aria-label="Список провайдеров"></section>

      <footer class="footer">
        <p>Лимиты и условия могут меняться — проверяйте их на сайте провайдера.</p>
        <nav class="resource-links" aria-label="Списки и каталоги">
          <a href="https://github.com/0xzr/freellmpool" target="_blank" rel="noopener noreferrer">freellmpool ↗</a>
          <a href="https://github.com/pacocartones/free-llm-api-hub" target="_blank" rel="noopener noreferrer">free-llm-api-hub ↗</a>
        </nav>
      </footer>
    </main>
  </body>
</html>
